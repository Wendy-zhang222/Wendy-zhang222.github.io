<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>趣英文阅读</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: #F6EFE1; color: #5A5046; min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card {
    background: #FFFDF7; border: 2px solid #E8DCC8; border-radius: 16px;
    box-shadow: 0 4px 0 #EAE2D1; padding: 40px 36px; max-width: 560px; width: 100%; text-align: center;
  }
  .tag {
    display: inline-block; border-radius: 999px; padding: 4px 16px; font-size: 12.5px;
    background: #F4EEDF; color: #8A8578; border: 1.5px solid #E8DCC8; margin-bottom: 20px;
  }
  h1 { font-size: 30px; font-weight: 700; letter-spacing: 2px; margin-bottom: 12px; }
  .sub { font-size: 15px; color: #8A8578; line-height: 1.8; margin-bottom: 26px; }
  .line { height: 2px; background: #F0E8D6; border-radius: 2px; margin: 0 auto 24px; width: 64px; }
  .note { font-size: 13.5px; color: #8A8578; line-height: 1.9; }
  .foot { margin-top: 28px; font-size: 12px; color: #A89F8E; }
</style>
</head>
<body>
  <div class="card">
    <div class="tag">建设中</div>
    <h1>趣英文阅读</h1>
    <div class="line"></div>
    <p class="sub">WEU 原创英文绘本体系 · 分级阅读<br>正在建设中，敬请期待</p>
    <p class="note">我们为小学阶段的孩子们准备了一套<br>从识字、阅读到故事的完整英语学习体系。</p>
    <div class="foot">趣英文 · Wendy's English Universe</div>
  </div>
</body>
</html>
